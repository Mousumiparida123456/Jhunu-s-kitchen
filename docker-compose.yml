services:
  postgres:
    image: postgres:16-alpine
    container_name: jhunu-kitchen-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jhunu_kitchen
    ports:
      - "5432:5432"
    volumes:
      - jhunu_kitchen_postgres_data:/var/lib/postgresql/data

volumes:
  jhunu_kitchen_postgres_data:
